<!DOCTYPE html>
<html>

<head>
    <title>登录系统</title>
    <meta charset="UTF-8">


    <script src="js/vue.js"></script>
    <link rel="stylesheet" href="https://unpkg.com/element-ui/lib/theme-chalk/index.css">
    <script src="https://unpkg.com/element-ui/lib/index.js"></script>
    <script src="js/axios-0.18.0.js"></script>

    <style>
        .login-page {
            background-image: linear-gradient(180deg, #2af598 0%, #009efd 100%);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .login-title {
            font-size: 20px;
        }

        .box-card {
            width: 375px;
        }
    </style>
</head>


<body>
<div id="app">
    <div class="login-page">
        <el-card class="box-card">
            <div slot="header" class="clearfix">
                <span class="login-title">选课系统</span>
            </div>
            <div class="login-form">
                <el-form :model="user" :rules="loginRules" ref="loginForm">
                    <el-form-item prop="userName">
                        <el-input type="text" v-model="user.userName" auto-complete="off" placeholder="请输入用户名">
                            <template slot="prepend"><i style="font-size:20px" class="el-icon-user"></i></template>
                        </el-input>
                    </el-form-item>
                    <el-form-item prop="passWord">
                        <el-input type="password" v-model="user.passWord" maxlength="6" auto-complete="off"
                                  placeholder="请输入密码">
                            <template slot="prepend"><i style="font-size:20px" class="el-icon-key"></i></template>
                        </el-input>
                    </el-form-item>
                    <el-form-item>
                        <el-button style="width:100%;" type="primary" @click="handleLogin" :loading="loading">登录
                        </el-button>
                    </el-form-item>
                </el-form>
                <div class="login-footer" style="margin-top: 15px; text-align: center;">
                    <el-link type="primary" href="register.html">没有账号？立即注册</el-link>
                </div>
            </div>
        </el-card>
    </div>
</div>


<script>

    new Vue({
        el: '#app',
        data() {
            return {
                loading: false,
                studentId: '',
                user: {
                    userName: '',
                    passWord: ''
                },
                loginRules: {
                    userName: [
                        {required: true, message: '请输入账户', trigger: 'blur'}
                    ],
                    passWord: [
                        {required: true, message: '请输入密码', trigger: 'blur'}
                    ]
                }
            }
        },
        methods: {
            handleLogin() {

                var _this = this;
                //创建表单对象
                this.loading = true;
                const params = new URLSearchParams();
                params.append('userName', this.user.userName);
                params.append('passWord', this.user.passWord);


                axios.post('http://localhost:8080/QGweek3_war/user/selectByUserName',params
                ).then(userRes => {
                    if (userRes.data.role === 'student') {
                        axios.get('http://localhost:8080/QGweek3_war/student/selectByUserId', {
                            params: {userId: userRes.data.userId}
                        }).then(studentRes => {

                            window.location.href = 'course.html?studentId=' + studentRes.data.studentId;
                        });
                    } else {
                        window.location.href = 'Admin.html';
                    }
                }).catch(error => {
                    this.$message.error('登录失败:账号或密码错误');

                });
                this.loading = false;
            }
        }
    })
</script>

</body>
</html>
